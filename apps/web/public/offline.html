<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #23303A; color: #F2F4F7; font-family: system-ui, sans-serif; text-align: center; padding: 1.5rem; }
    main { max-width: 26rem; } svg { width: 84px; margin-bottom: 1rem; }
    p { color: #B4BDC8; line-height: 1.6; } [lang=ur] { font-family: 'Noto Nastaliq Urdu', 'Noto Naskh Arabic', serif; line-height: 2; }
    button { margin-top: 1rem; background: #F5A524; color: #1A1405; border: 0; border-radius: 12px; padding: .8rem 1.4rem; font-weight: 700; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 120 110" aria-hidden="true"><g fill="none" stroke="#F5A524" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"><path d="M14 52 60 18l46 34M24 50v42h72V50M52 92V68h16v24M60 18V4M10 98h100"/></g></svg>
    <h1 style="margin:.2rem 0">You are offline</h1>
    <p>There is no internet connection right now. Anything you already saved on this phone is safe and will be sent when you are back online.</p>
    <p lang="ur" dir="rtl">اس وقت انٹرنیٹ دستیاب نہیں۔ جو کچھ آپ اس فون پر محفوظ کر چکے ہیں وہ محفوظ ہے اور انٹرنیٹ ملتے ہی بھیج دیا جائے گا۔</p>
    <button onclick="location.reload()">Try again · دوبارہ کوشش کریں</button>
  </main>
</body>
</html>
