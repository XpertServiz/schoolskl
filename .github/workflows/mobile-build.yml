name: mobile-build

# Builds the parent/teacher app.
#  - android-apk  : an installable APK you can download from the run page (signed with the DEBUG key: for testing, not the Play Store)
#  - ios-simulator: opt-in; compiles the iOS app for the simulator (unsigned). macOS minutes are ~10x as expensive, so it is off by default
#  - eas          : opt-in; store-grade builds (Android AAB / iOS IPA, properly signed) through Expo's build service — needs EXPO_TOKEN
# Run it from the Actions tab ("Run workflow"), or push a tag like  mobile-v0.1.0.
on:
  workflow_dispatch:
    inputs:
      ios_simulator:
        description: Also build the iOS simulator app (macOS runner, slow and costly)
        type: boolean
        default: false
      eas_build:
        description: Also start a store-grade EAS build (needs the EXPO_TOKEN secret)
        type: boolean
        default: false
      eas_profile:
        description: EAS profile (preview = installable APK/IPA for testers; production = store bundles)
        type: choice
        options: [preview, production]
        default: preview
  push:
    tags: ["mobile-v*"]

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Public values only (they are compiled into the app and visible to anyone who unpacks it). NEVER put a service-role key here.
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
  CI: "1"

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # only to publish the "apk-latest" release
    steps:
      - uses: actions/checkout@v4

      - name: Check the build secrets exist
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Add the repository secrets EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions). They are the project URL and the ANON key — never the service-role key."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - name: Install the mobile app
        working-directory: apps/mobile
        run: npm ci --legacy-peer-deps

      - name: Type-check before spending build minutes
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: Generate the native Android project from app.json
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Give every build a higher versionCode (the run number)
        working-directory: apps/mobile/android/app
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" build.gradle
          grep -n "versionCode" build.gradle

      - name: Build the release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Name the file and record its checksum
        id: apk
        run: |
          mkdir -p out
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "out/school-android-${{ github.run_number }}.apk"
          cd out && sha256sum *.apk | tee SHA256SUMS
          {
            echo "### Android APK built"
            echo "Download it from **Artifacts** below, then open it on an Android phone (allow installs from your browser/file manager once)."
            echo "Signed with the debug key: fine for testing, **not** for the Play Store (use the EAS production profile for that)."
            echo '```'; cat SHA256SUMS; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: school-android-apk
          path: out/
          retention-days: 14
          if-no-files-found: error

      # One stable public download link for testers (a pre-release named "apk-latest", replaced on every build):
      #   https://github.com/<owner>/<repo>/releases/download/apk-latest/school-android.apk
      # The APK holds only public values (Supabase URL + anon key), never a secret.
      - name: Publish to the "apk-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "out/school-android-${{ github.run_number }}.apk" out/school-android.apk
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest out/school-android.apk --prerelease --title "Android test app (build ${{ github.run_number }})" \
            --notes "Test build ${{ github.run_number }} from ${{ github.sha }}. Uninstall the previous School app before installing. Fake demo data only."

  ios-simulator:
    name: iOS simulator build (unsigned)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ios_simulator }}
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - run: npm ci
      - working-directory: apps/mobile
        run: npm ci --legacy-peer-deps
      - name: Generate the native iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install --clean
      - name: Install pods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Build for the simulator (no code signing)
        working-directory: apps/mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 40
          APP=$(find build/Build/Products -name "*.app" -maxdepth 3 | head -1)
          mkdir -p ../../../out && ditto -c -k --sequesterRsrc --keepParent "$APP" "../../../out/school-ios-simulator-${{ github.run_number }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: school-ios-simulator
          path: out/
          retention-days: 14
          if-no-files-found: error

  eas:
    name: EAS store-grade build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.eas_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check the Expo token exists
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the repository secret EXPO_TOKEN (create it at expo.dev → Account settings → Access tokens)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install the mobile app
        working-directory: apps/mobile
        run: |
          # file: dependencies point at ../../packages, so those need their own install first
          (cd ../.. && npm ci)
          npm ci --legacy-peer-deps
      - name: Start the build on Expo's servers (it keeps running after this job ends)
        working-directory: apps/mobile
        run: eas build --platform all --profile ${{ inputs.eas_profile }} --non-interactive --no-wait
        env:
          # EAS reads EXPO_PUBLIC_* from its own environment variables too; these make the first run work without extra setup
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      - run: echo "Build queued — follow it at https://expo.dev (Builds). Download links appear there when it finishes." >> "$GITHUB_STEP_SUMMARY"
